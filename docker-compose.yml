services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
    ports:
      - "3307:3307"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend    
    container_name: node_backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: app_db
    volumes:
      - ./backend:/app                  # Sincroniza o código e a pasta uploads com o seu PC
      - /app/node_modules              # Evita sobrescrever as dependências do container
    depends_on:
      - db

  frontend:
    build: ./frontend     # Aponta para a pasta frontend onde está o segundo Dockerfile
    container_name: react_frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend

volumes:
  mysql_data: